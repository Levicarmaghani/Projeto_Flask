<!--Documento html-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Dias Trabalhados</title>

    <!--Link Bootstrap CSS-->
    <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous"
    >
</head>

<!--Campo dia ---------------------------------------------------------------------->
<!--Body -->
<body class="bg-dark text-white"><!--Cor Fundo-->

    <h1 class="text-center mb-4 text-primary">Registros de Dias Trabalhados</h1><!--Cor do Titulo-->

    <!--Bloco que exibe mensagens de erro ou sucesso do Flask-->
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% if mensagens %}
        {% for categoria, mensagem in mensagens %}
          <div class="alert alert-{{ 'danger' if categoria == 'erro' else 'success' }} mt-3">
            {{ mensagem }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!---- Container geral com duas colunas (Formulários | Registros) -->
    <div class="container mt-4">
        <div class="row">
            
            <!--===============================COLUNA ESQUERDA (FORMULÁRIOS)======================-->
            <div class="col-md-6">
                {% include 'esquerda.html' %}
            </div>

            <!--===============================COLUNA DIREITA (REGISTROS)===========================-->
            <div class="col-md-6">
                {% include 'direita.html' %}
            </div>
        </div>
    </div>

    <!-- Script JavaScript para atualizar total automaticamente -->
    <script>
        function atualizarTotal() {
            fetch("/total")
            .then(response => response.json())
            .then(data => {
                if(data.sucesso){
                    document.getElementById("total").textContent = "R$ " + data.total.toFixed(2);
                } else {
                    document.getElementById("total").textContent = "Erro ao calcular total";
                }
            });
        }

        // Chama ao carregar a página
        window.onload = atualizarTotal;
    </script>
</body>
</html>
